name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.2.8)'
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.7"
  CORE_VERSION: "v1.13.11"
  VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: |
          $v = "${{ env.VERSION }}".TrimStart('v')
          (Get-Content pubspec.yaml) -replace '^version:.*', "version: $v" | Set-Content pubspec.yaml

      - name: Download core
        run: |
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$env:CORE_VERSION/libsingcast-$env:CORE_VERSION-windows-amd64.tar.gz" -o "libsingcast.tar.gz"
          tar -zxf libsingcast.tar.gz
          Move-Item -Force singcast-windows-amd64.dll windows/core/libsingcast-windows.dll

      - name: Setup Chinese language for Inno Setup
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/raw/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "ChineseSimplified.isl"
          mv ChineseSimplified.isl "C:\Program Files (x86)\Inno Setup 6\Languages\"

      - name: Build & package
        run: |
          dart pub global activate fastforge
          fastforge package --platform=windows --targets=exe,zip

      - name: Rename artifacts
        run: |
          $ver = "${{ env.VERSION }}".TrimStart('v')
          $distDir = "dist\$ver"
          $exe = (Get-ChildItem "$distDir\*.exe")[0]
          $zip = (Get-ChildItem "$distDir\*.zip")[0]
          Move-Item -Force $exe.FullName "$distDir\singcast-$ver-windows-amd64.exe"
          Move-Item -Force $zip.FullName "$distDir\singcast-$ver-windows-amd64-portable.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*/*.exe,dist/*/*.zip
          overwrite_files: true

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: |
          v="${VERSION#v}"
          sed -i "s/^version:.*/version: $v/" pubspec.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libnotify-dev
          wget -O /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Download core
        run: |
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$CORE_VERSION/libsingcast-$CORE_VERSION-linux-amd64.tar.gz" -o libsingcast.tar.gz
          tar -zxf libsingcast.tar.gz
          mv libsingcast-linux-amd64.so linux/core/libsingcast-linux.so

      - name: Build & package
        run: |
          dart pub global activate fastforge
          fastforge package --platform=linux --targets=appimage,deb,zip

      - name: Rename artifacts
        run: |
          v="${VERSION#v}"
          d="dist/$v"
          mv "$d/singcast-$v-linux.AppImage" "$d/singcast-$v-linux-amd64.AppImage"
          mv "$d/singcast-$v-linux.deb" "$d/singcast-$v-linux-amd64.deb"
          mv "$d/singcast-$v-linux.zip" "$d/singcast-$v-linux-amd64.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*/*
          overwrite_files: true

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - arch: amd64
            core_arch: amd64
          - arch: arm64
            core_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: |
          v="${VERSION#v}"
          sed -i "" "s/^version:.*/version: $v/" pubspec.yaml

      - name: Download core
        run: |
          mkdir -p macos/Frameworks
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$CORE_VERSION/libsingcast-$CORE_VERSION-darwin-${{ matrix.core_arch }}.tar.gz" -o libsingcast.tar.gz
          tar -zxf libsingcast.tar.gz
          mv libsingcast-darwin-${{ matrix.core_arch }}.dylib macos/Frameworks/libsingcast-darwin.dylib

      - name: Build
        env:
          ARCHS: ${{ matrix.arch == 'amd64' && 'x86_64' || '' }}
        run: flutter build macos --release

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/singcast.app

      - name: Create DMG
        run: |
          v="${VERSION#v}"
          APP_PATH="build/macos/Build/Products/Release/singcast.app"
          hdiutil create -volname "Singcast" -srcfolder "$APP_PATH" -ov -format UDZO "build/macos/Build/Products/Release/singcast-$v-macos-${{ matrix.arch }}.dmg"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: build/macos/Build/Products/Release/*.dmg
          overwrite_files: true

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: android-arm64
            arch: arm64
            core_arch: arm64
          - target: android-x64
            arch: x64
            core_arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: |
          v="${VERSION#v}"
          sed -i "s/^version:.*/version: $v/" pubspec.yaml

      - name: Setup Android signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF
          fi

      - name: Download core
        run: |
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$CORE_VERSION/libsingcast-$CORE_VERSION-android-${{ matrix.core_arch }}.tar.gz" -o libsingcast.tar.gz
          tar -zxf libsingcast.tar.gz
          mv libsingcast-android-${{ matrix.core_arch }}.aar android/app/libs/libsingcast.aar

      - name: Build APK
        run: flutter build apk --release --target-platform ${{ matrix.target }}

      - name: Rename artifact
        run: |
          v="${VERSION#v}"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/singcast-$v-android-${{ matrix.arch }}.apk"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: build/app/outputs/flutter-apk/*.apk
          overwrite_files: true
