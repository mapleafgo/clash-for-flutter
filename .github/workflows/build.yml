name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.2.8)'
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.7"
  CORE_VERSION: "v1.13.11-beta3"
  VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: |
          $v = "${{ env.VERSION }}".TrimStart('v')
          (Get-Content pubspec.yaml) -replace '^version:.*', "version: $v" | Set-Content pubspec.yaml

      - name: Download core
        run: |
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$env:CORE_VERSION/libsingcast-$env:CORE_VERSION-windows-amd64.tar.gz" -o "libsingcast.tar.gz"
          tar -zxf libsingcast.tar.gz
          Move-Item -Force singcast-windows-amd64.dll windows/core/libsingcast-windows.dll

      - name: Setup Inno Setup
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/raw/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "ChineseSimplified.isl"
          mv ChineseSimplified.isl "C:\Program Files (x86)\Inno Setup 6\Languages\"

      - name: Build
        run: flutter build windows

      - name: Package portable
        run: |
          $system = "C:\Windows\System32"
          $release = "build/windows/x64/runner/Release/"
          cp $system\msvcp140.dll $release
          cp $system\vcruntime140.dll $release
          cp $system\vcruntime140_1.dll $release
          New-Item -Path build/windows/x64/Output -ItemType Directory
          Compress-Archive -Path "$release*" -DestinationPath "build/windows/x64/Output/singcast-$env:VERSION-windows-amd64-portable.zip"

      - name: Build installer
        run: |
          cd build/windows/x64
          $issContent = @"
          #define MyAppName "Singcast"
          #define MyAppVersion "$($env:VERSION)"
          #define MyAppPublisher "mapleafgo"
          #define MyAppURL "https://github.com/mapleafgo/clash-for-flutter"
          #define MyAppExeName "singcast.exe"
          #define MyOutputName "singcast"

          [Setup]
          AppId={{B3039CF4-E394-42B6-971C-4BE97F322DE8}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={autopf}\{#MyOutputName}
          DisableProgramGroupPage=yes
          LicenseFile=..\..\..\LICENSE
          PrivilegesRequired=lowest
          OutputBaseFilename={#MyOutputName}
          SetupIconFile=..\..\..\assets\icon.ico
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          LanguageDetectionMethod=uilanguage
          ShowLanguageDialog=yes

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: ".\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [UninstallDelete]
          Type: filesandordirs; Name: "{app}"

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
          "@
          $issContent | Out-File -FilePath setup.iss -Encoding UTF8
          iscc.exe setup.iss
          mv "Output/singcast.exe" "Output/singcast-$env:VERSION-windows-amd64.exe"
          Compress-Archive -Path "Output/singcast-$env:VERSION-windows-amd64.exe" -DestinationPath "Output/singcast-$env:VERSION-windows-amd64.zip"
          Remove-Item -Path "Output/singcast-$env:VERSION-windows-amd64.exe"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: build/windows/x64/Output/*
          overwrite: true

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: sed -i "s/^version:.*/version: ${VERSION#v}/" pubspec.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libnotify-dev

      - name: Download core
        run: |
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$CORE_VERSION/libsingcast-$CORE_VERSION-linux-amd64.tar.gz" -o libsingcast.tar.gz
          tar -zxf libsingcast.tar.gz
          mv libsingcast-linux-amd64.so linux/core/libsingcast-linux.so

      - name: Build & package
        run: |
          dart pub global activate flutter_distributor
          flutter_distributor package --platform=linux --targets=appimage,deb

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*/*
          overwrite: true

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: sed -i "" "s/^version:.*/version: ${VERSION#v}/" pubspec.yaml

      - name: Install appdmg
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install setuptools
          npm install -g appdmg

      - name: Download cores
        run: |
          mkdir -p core && cd core
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$CORE_VERSION/libsingcast-$CORE_VERSION-darwin-amd64.tar.gz" -o libsingcast-amd64.tar.gz
          tar -zxf libsingcast-amd64.tar.gz
          mv libsingcast-darwin-amd64.dylib libsingcast-amd64.dylib
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$CORE_VERSION/libsingcast-$CORE_VERSION-darwin-arm64.tar.gz" -o libsingcast-arm64.tar.gz
          tar -zxf libsingcast-arm64.tar.gz
          mv libsingcast-darwin-arm64.dylib libsingcast-arm64.dylib

      - name: Create universal binary
        run: |
          PROJECT_DIR=$(pwd)
          mkdir -p $PROJECT_DIR/macos/Frameworks
          mv core/libsingcast-amd64.dylib $PROJECT_DIR/macos/Frameworks/amd64-lib
          mv core/libsingcast-arm64.dylib $PROJECT_DIR/macos/Frameworks/arm64-lib
          cd $PROJECT_DIR/macos/Frameworks
          lipo -create -output libsingcast-darwin.dylib amd64-lib arm64-lib

      - name: Build
        run: flutter build macos

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/singcast.app

      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          cat > appdmg.json << 'EOF'
          {
            "title": "Singcast",
            "icon": "singcast.app/Contents/Resources/AppIcon.icns",
            "contents": [
              { "x": 448, "y": 344, "type": "link", "path": "/Applications" },
              { "x": 192, "y": 344, "type": "file", "path": "singcast.app" }
            ]
          }
          EOF
          mkdir -p dist
          appdmg appdmg.json dist/singcast-$VERSION-macos.dmg

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: build/macos/Build/Products/Release/dist/*.dmg
          overwrite: true

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: android-arm64
            arch: arm64
            core_arch: arm64
          - target: android-x64
            arch: x64
            core_arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sync version
        run: sed -i "s/^version:.*/version: ${VERSION#v}/" pubspec.yaml

      - name: Setup Android signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF
          fi

      - name: Download core
        run: |
          curl -L "https://github.com/mapleafgo/cff-core/releases/download/$CORE_VERSION/libsingcast-$CORE_VERSION-android-${{ matrix.core_arch }}.tar.gz" -o libsingcast.tar.gz
          tar -zxf libsingcast.tar.gz
          mv libsingcast-android-${{ matrix.core_arch }}.aar android/app/libs/libsingcast.aar

      - name: Build APK
        run: flutter build apk --release --target-platform ${{ matrix.target }}

      - name: Rename artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/singcast-${{ env.VERSION }}-${{ matrix.arch }}.apk

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: build/app/outputs/flutter-apk/*.apk
          overwrite: true
