name: clash_for_flutter
description: A multi-platform Clash client.
publish_to: 'none'
version: 1.2.7

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  signals_flutter: ^6.0.0

  # 路由
  go_router: ^14.8.0

  # 网络
  dio: ^5.9.0
  web_socket_channel: ^3.0.3

  # JSON
  json_annotation: ^4.11.0

  # 桌面端
  window_manager: ^0.5.1
  tray_manager: ^0.5.0
  launch_at_startup: ^0.3.1
  desktop_lifecycle: ^0.1.1
  proxy_manager: ^0.0.3
  local_notifier: ^0.1.6
  protocol_handler: ^0.2.0

  # 工具
  ffi: ^2.2.0
  file_picker: ^10.3.7
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  path: ^1.9.0
  settings_yaml: ^8.3.1
  intl: ^0.20.2
  timeago: ^3.7.1

  # UI
  cupertino_icons: ^1.0.9
  data_table_2: ^2.7.2
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/

ffigen:
  name: "Clash"
  output: 'lib/clash_generated_bindings.dart'
  headers:
    entry-points:
      - 'core/libclash.h'
  llvm-path:
    - 'D:\Scoop\apps\llvm\current'