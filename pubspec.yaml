name: singcast
description: A multi-platform Clash client.
publish_to: "none"
version: 1.13.11-beta

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  signals_flutter: ^6.0.0

  # 路由
  go_router: ^17.2.2

  # 网络
  dio: ^5.9.0

  # JSON
  json_annotation: ^4.11.0

  # 桌面端
  window_manager: ^0.5.1
  launch_at_startup: ^0.3.1
  desktop_lifecycle: ^0.1.1
  proxy_manager: ^0.0.3
  local_notifier: ^0.1.6

  # 工具
  ffi: ^2.2.0
  file_picker: ^11.0.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  path: ^1.9.0
  settings_yaml: ^8.3.1
  intl: ^0.20.2
  timeago: ^3.7.1

  # UI
  cupertino_icons: ^1.0.9
  flutter_staggered_grid_view: ^0.7.0
  desktop_tray: ^2026.4.19
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.0
  ffigen: ^20.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/

ffigen:
  name: "LibCoreBindings"
  description: "FFI bindings for cff-core (singcast) native library"
  output: "lib/core/ffi_bindings.dart"
  headers:
    entry-points:
      - "lib/core/libsingcast-linux.h"
  compiler-opts:
    - "-I/usr/lib/clang/22/include"
  functions:
    include:
      - CoreInit
      - CoreStart
      - CoreStop
      - CoreClose
      - CoreCheckConfig
      - CoreReloadConfig
      - CoreQueryProxies
      - CoreQueryTraffic
      - CoreQueryLogs
      - CoreQueryConnections
      - CoreSelectProxy
      - CoreSetMode
      - CoreCloseConnection
      - CoreCloseAllConnections
      - CoreTestDelay
      - CoreGetVersion
      - CoreSetCallback
      - CoreFreeString
      - CoreSetTunFd
      - CoreStartWithContent
